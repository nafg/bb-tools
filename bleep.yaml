$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: 1.0.0-M10
jvm:
  name: graalvm-community:25.0.1
projects:
  bb-plugin-facades:
    extends:
    - template-common
    - template-js
  agentmail:
    dependsOn: bb-plugin-facades
    extends:
    - template-common
    - template-js
    folder: ./bb-plugin-agentmail/agentmail
  agentmail-app:
    extends:
    - template-common
    - template-js
    dependencies:
    - com.github.japgolly.scalajs-react::core:4.0.0
    folder: ./bb-plugin-agentmail/agentmail-app
  converse:
    dependsOn: bb-plugin-facades
    extends:
    - template-common
    - template-js
    folder: ./bb-plugin-converse/converse
  converse-core:
    cross:
      jvm3:
        extends:
        - template-common
        - template-jvm
      js3:
        extends:
        - template-common
        - template-js
    folder: ./bb-plugin-converse/converse-core
  converse-core-test:
    dependsOn: converse-core
    extends:
    - template-common
    - template-jvm
    isTestProject: true
    dependencies:
    - org.scalameta::munit:1.1.1
    folder: ./bb-plugin-converse/converse-core-test
  converse-app:
    dependsOn: converse-core
    extends:
    - template-common
    - template-js
    folder: ./bb-plugin-converse/converse-app
templates:
  template-jvm:
    platform:
      name: jvm
  template-common:
    scala:
      options: -encoding utf8 -feature -unchecked
      strict: true
      version: 3.8.3
    source-layout: cross-pure
  template-js:
    platform:
      name: js
      jsVersion: 1.22.0
      jsKind: esmodule
      jsEmitSourceMaps: false
      jsJsdom: false
      jsNodeVersion: 24.4.1
